# Nitro enclave defaults (Type 1 KMS). Copy to /executor.conf in enclave image.
CHANNEL_TYPE=vsock
EXECUTOR_PORT=4000
EXECUTOR_ADMIN_PORT=4001

# Enable KMS-backed recovery (Type 1)
EXECUTOR_KMS_ENABLED=true
# REQUIRED: set your CMK ARN
EXECUTOR_KMS_KEY_ARN=
EXECUTOR_KMS_REGION=eu-west-1
EXECUTOR_KMS_PROXY_PORT=8000
