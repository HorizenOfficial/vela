specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: ProcessorEndpoint
    network: horizen-testnet
    source:
      address: "0x755511F7e267fEAd4433cc9378E382eAdC648199"
      abi: ProcessorEndpoint
      startBlock: 6623732
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - RequestSubmitted
        - RequestCompleted
        - UserEvent
      abis:
        - name: ProcessorEndpoint
          file: ./abis/ProcessorEndpoint.json
      eventHandlers:
        - event: RequestSubmitted(indexed bytes32,indexed address)
          handler: handleRequestSubmitted
        - event: RequestCompleted(indexed bytes32,uint256,uint8,uint8,string)
          handler: handleRequestCompleted
        - event: UserEvent(indexed uint64,indexed bytes32,indexed string,bytes)
          handler: handleUserEvent
      file: ./src/processor-endpoint.ts
