networks:
  pes_network:
    internal: true
    ipam:
      config:
        - subnet: ${INTERNAL_NETWORK_SUBNET}
  inet:     

volumes:
  horizen-cce-manager-reports:  
  horizen-cce-manager-reports:
  horizen-cce-chain-data:

services:
  executor:
    image: horizen/cce-executor
    container_name: horizen-cce-executor
    restart: always
    networks:
      pes_network:
        ipv4_address: ${EXECUTOR_IP_ADDRESS}
    environment:
      - EXECUTOR_IP_ADDRESS
      - EXECUTOR_IP_PORT
      - EXECUTOR_KEYSET_RECOVERY_TYPE
      - EXECUTOR_FUEL_PRICE_PER_UNIT
      - EXECUTOR_MIN_FEE_PER_REQUEST
    depends_on:
      - chain
  manager:
    image: horizen/cce-manager
    container_name: horizen-cce-manager
    restart: always 
    environment:
      - EXECUTOR_IP_ADDRESS
      - EXECUTOR_IP_PORT  
      - MANAGER_KEY_SECP256
      - MANAGER_DATA_FOLDER=${MANAGER_DATA_FOLDER:-/data}
      # not set to a default, so if the .env does not set it (it is optional) Go app will not enable the feature
      - MANAGER_REPORTS_FOLDER
      - CHAIN_RPC_PROTOCOL
      - CHAIN_RPC_ADDRESS
      - CHAIN_RPC_PORT
      - CHAIN_PROCESSOR_ADDRESS
      - CHAIN_TEEAUTHENTICATOR_ADDRESS
      - BLOCKCHAIN_POLLING_INTERVAL
      - REORG_TIMEOUT
    networks:
      pes_network:
        ipv4_address: ${MANAGER_IP_ADDRESS}
      inet:    
    volumes:
      - horizen-cce-manager-reports:${MANAGER_DATA_FOLDER:-/data}
      # We must set a default path if .env does not set it, otherwise compose will throw an error
      # If the optional feature is not enabled, we will simply have an empty volume
      - horizen-cce-manager-reports:${MANAGER_REPORTS_FOLDER:-/reports}
      # WASM input folder
      - ./wasms:${MANAGER_INPUT_WASMS:-/input_wasms}
    depends_on:
      - executor 
      - chain
  authorityservice:
    image: horizen/cce-authorityservice
    container_name: horizen-cce-authorityservice
    restart: always
    environment:
      - AUTHORITY_SERVICE_LISTEN_ADDRESS
      - AUTHORITY_SERVICE_CHAIN_ID
      - AUTHORITY_SERVICE_NONCE_TTL
      - MANAGER_REPORTS_FOLDER=${MANAGER_DATA_FOLDER:-/data}
    networks:
      pes_network:
        ipv4_address: ${AUTHORITY_SERVICE_IP_ADDRESS}
      inet:
    volumes:
      - horizen-cce-manager-reports:${MANAGER_DATA_FOLDER:-/data}
    depends_on:
      - chain
      - manager
  chain:
    image: horizen/cce-chain
    container_name: horizen-cce-chain
    restart: always 
    environment:
      - DATA_FOLDER=${CHAIN_DATA_FOLDER:-/data}
      - RPCPORT=${CHAIN_RPC_PORT:-8545}
    ports:
      - "${CHAIN_RPC_PORT}:${CHAIN_RPC_PORT}"
    networks:
      pes_network:
        ipv4_address: ${CHAIN_RPC_ADDRESS}
      inet:    
    volumes:
      - horizen-cce-chain-data:${CHAIN_DATA_FOLDER:-/data} 
