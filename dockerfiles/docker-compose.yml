networks:
  pes_network:
    internal: true
    ipam:
      config:
        - subnet: ${INTERNAL_NETWORK_SUBNET}
  inet:     

volumes:
  horizen-cce-manager-data:
  horizen-cce-shared-data:
  horizen-cce-chain-data:
  horizen-cce-logs:
  horizen-cce-deploy-data:
  horizen-cce-subgraph-postgres:
  horizen-cce-subgraph-ipfs:

services:
  kms-proxy:
    image: horizen/kms-proxy
    container_name: horizen-kms-proxy
    # Opt-in: the kms-proxy only starts when the "kms" compose profile is
    # active. Required in production (EXECUTOR_KEYSET_RECOVERY_TYPE=1).
    # Activate with COMPOSE_PROFILES=kms (or `docker compose --profile kms ...`).
    profiles: ["kms"]
    restart: always
    privileged: true
    devices:
      - /dev/vsock:/dev/vsock
    environment:
      - KMS_PROXY_DEBUG
      - KMS_PROXY_PORT
      - KMS_PROXY_REGION
      - KMS_PROXY_ALLOWED_ACTIONS
      - KMS_PROXY_ALLOWED_KEY_ARNS
      - KMS_PROXY_ALLOW_ALL_KEYS
      - KMS_PROXY_UPSTREAM_TIMEOUT_SEC
      - KMS_PROXY_MAX_BODY_BYTES
      - KMS_PROXY_MAX_RESPONSE_BYTES
    networks:
      inet:
  executor:
    image: horizen/cce-executor
    container_name: horizen-cce-executor
    restart: always
    privileged: true
    devices:
      - /dev/vsock:/dev/vsock
    networks:
      pes_network:
        ipv4_address: ${EXECUTOR_IP_HOST}
    environment:
      - CHANNEL_TYPE
      - EXECUTOR_IP_HOST
      - EXECUTOR_PORT
      - LOG_SERVER_IP_HOST
      - LOG_SERVER_PORT
      - MANAGER_VSOCK_CID
      - EXECUTOR_KMS_KEY_ARN
      - EXECUTOR_KMS_REGION
      - EXECUTOR_KMS_PROXY_PORT
      - EXECUTOR_KEYSET_RECOVERY_TYPE
      - EXECUTOR_FUEL_PRICE_PER_UNIT
      - EXECUTOR_MIN_FEE_PER_REQUEST
      - EXECUTOR_MAX_CACHED_MODULES
      - EXECUTOR_LOG_KIND
      - EXECUTOR_LOG_CONSOLE
      - EXECUTOR_LOG_CONSOLE_LEVEL
      - EXECUTOR_LOG_CONSOLE_COLOR
      - EXECUTOR_LOG_FILE_NAME
      - EXECUTOR_LOG_FILE_LEVEL
      - EXECUTOR_LOG_NETWORK_LEVEL
      - EXECUTOR_COMMUNICATION_PARAMS_REQUEST_TIMEOUT_SEC
      - EXECUTOR_FIXED_SIGNING_KEY
      - EXECUTOR_FIXED_COMMUNICATION_KEY
      - EXECUTOR_FIXED_STATE_KEY
    depends_on:
      - chain
  manager:
    image: horizen/cce-manager
    container_name: horizen-cce-manager
    restart: always
    privileged: true
    devices:
      - /dev/vsock:/dev/vsock
    ports:
      # Expose admin server so admincli on the Docker host can connect
      - "${MANAGER_ADMIN_PORT:-4002}:${MANAGER_ADMIN_PORT:-4002}"
    environment:
      - CHANNEL_TYPE
      - EXECUTOR_IP_HOST
      - EXECUTOR_VSOCK_CID
      - EXECUTOR_PORT  
      - MANAGER_ADMIN_COMMUNICATION_PARAMS_REQUEST_TIMEOUT_SEC
      - MANAGER_IP_HOST
      - MANAGER_ADMIN_PORT
      - MANAGER_ADMIN_SERVER_HOST
      - MANAGER_KEY_SECP256
      - MANAGER_DATA_FOLDER=${MANAGER_DATA_FOLDER:-/data}
      - SHARED_DATA_FOLDER=${SHARED_DATA_FOLDER:-/shared-data}
      - MANAGER_LOG_KIND
      - MANAGER_LOG_CONSOLE
      - MANAGER_LOG_CONSOLE_LEVEL
      - MANAGER_LOG_CONSOLE_COLOR
      - MANAGER_LOG_FILE_NAME
      - MANAGER_LOG_FILE_LEVEL
      - MANAGER_LOG_NETWORK_LEVEL
      - LOG_SERVER_IP_HOST
      - LOG_SERVER_PORT
      - LOG_SERVER_CONSOLE
      - LOG_SERVER_FOLDER=${LOG_SERVER_FOLDER:-/logs}
      - LOG_SERVER_FILE_NAME
      # Log rotation settings (optional, only used when LOG_SERVER_FILE_NAME is set)
      - LOG_SERVER_FILE_ROTATION
      - LOG_SERVER_FILE_MAX_SIZE_MB
      - LOG_SERVER_FILE_MAX_BACKUPS
      - LOG_SERVER_FILE_MAX_AGE_DAYS
      - LOG_SERVER_FILE_COMPRESS
      - CHAIN_RPC_PROTOCOL
      - CHAIN_RPC_ADDRESS
      - CHAIN_RPC_PORT
      - CHAIN_PROCESSOR_ADDRESS
      - CHAIN_TEEAUTHENTICATOR_ADDRESS
      - BLOCKCHAIN_POLLING_INTERVAL
      - MAX_BATCH_SIZE
      - BLOCKCHAIN_CONNECT_TIMEOUT
      - REORG_TIMEOUT
      - HANDSHAKE_TIMEOUT
      - MANAGER_COMMUNICATION_PARAMS_REQUEST_TIMEOUT_SEC
    networks:
      pes_network:
        ipv4_address: ${MANAGER_IP_HOST}
      inet:    
    volumes:
      - horizen-cce-manager-data:${MANAGER_DATA_FOLDER:-/data}
      - horizen-cce-shared-data:${SHARED_DATA_FOLDER:-/shared-data}
      - horizen-cce-logs:${LOG_SERVER_FOLDER:-/logs}
      - horizen-cce-deploy-data:/deploy-data:ro
    depends_on:
      executor:
        condition: service_started
      deployer:
        condition: service_completed_successfully
  authorityservice:
    image: horizen/cce-authorityservice
    container_name: horizen-cce-authorityservice
    restart: always
    ports:
      - "8081:8081"
    environment:
      - AUTHORITY_SERVICE_LISTEN_ADDRESS
      - CHAIN_ID
      - AUTHORITY_SERVICE_NONCE_TTL
      - CHAIN_RPC_PROTOCOL
      - CHAIN_RPC_ADDRESS
      - CHAIN_RPC_PORT
      - CHAIN_PROCESSOR_ADDRESS
      - AUTHORITY_SERVICE_SUBGRAPH_URL
      - SHARED_DATA_FOLDER=${SHARED_DATA_FOLDER:-/shared-data}
      - DEPLOY_ARTIFACTS_MAX_SIZE_MB
      - AUTHORITY_SERVICE_LOG_CONSOLE
      - AUTHORITY_SERVICE_LOG_CONSOLE_LEVEL
      - AUTHORITY_SERVICE_LOG_CONSOLE_COLOR
      - AUTHORITY_SERVICE_LOG_FILE_NAME
      - AUTHORITY_SERVICE_LOG_FILE_LEVEL
    networks:
      pes_network:
        ipv4_address: ${AUTHORITY_SERVICE_IP_ADDRESS}
      inet:
    volumes:
      - horizen-cce-shared-data:${SHARED_DATA_FOLDER:-/shared-data}
      - horizen-cce-deploy-data:/deploy-data:ro
    depends_on:
      manager:
        condition: service_started
      deployer:
        condition: service_completed_successfully
      subgraph-deployer:
        condition: service_completed_successfully
  chain:
    image: horizen/cce-chain
    container_name: horizen-cce-chain
    restart: always
    environment:
      - DATA_FOLDER=${CHAIN_DATA_FOLDER:-/data}
      - RPCPORT=${CHAIN_RPC_PORT:-8545}
    ports:
      - "${CHAIN_RPC_PORT}:${CHAIN_RPC_PORT}"
    networks:
      pes_network:
        ipv4_address: ${CHAIN_RPC_ADDRESS}
      inet:
    volumes:
      - horizen-cce-chain-data:${CHAIN_DATA_FOLDER:-/data}
  deployer:
    image: horizen/cce-deployer
    container_name: horizen-cce-deployer
    restart: "no"
    environment:
      - CHAIN_RPC_URL=http://${CHAIN_RPC_ADDRESS}:${CHAIN_RPC_PORT:-8545}
      - NETWORK=local
      - PRIVATE_KEY=${DEPLOYER_PRIVATE_KEY}
      - ADMIN=${DEPLOYER_ADMIN}
      - UPDATE_STATUS_OPERATOR=${UPDATE_STATUS_OPERATOR}
      - TEE_PCR0=${TEE_PCR0:-}
      - TEE_MAX_VERIFICATION_AGE=${TEE_MAX_VERIFICATION_AGE:-}
      - TEE_NO_ATTESTATION=${TEE_NO_ATTESTATION}
      - TEE_SIGNER_ADDRESS=${TEE_SIGNER_ADDRESS}
      - TEE_PUB_P521=${TEE_PUB_P521}
      - MIN_FEE_PER_REQUEST=${MIN_FEE_PER_REQUEST}
      - DEPLOY_OUTPUT_DIR=/deploy-data
      # Optional: deploy a MockERC20 and allowlist it on ProcessorEndpoint (dev/test only).
      - DEPLOY_MOCK_ERC20=${DEPLOY_MOCK_ERC20:-}
      - MOCK_ERC20_NAME=${MOCK_ERC20_NAME:-}
      - MOCK_ERC20_SYMBOL=${MOCK_ERC20_SYMBOL:-}
      - MOCK_ERC20_DECIMALS=${MOCK_ERC20_DECIMALS:-}
    networks:
      pes_network:
    volumes:
      - horizen-cce-deploy-data:/deploy-data
    depends_on:
      chain:
        condition: service_started
  subgraph-postgres:
    image: postgres:14
    container_name: horizen-cce-subgraph-postgres
    restart: always
    command:
      [
        "postgres",
        "-cshared_preload_libraries=pg_stat_statements",
        "-cmax_connections=200",
      ]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      PGDATA: "/var/lib/postgresql/data"
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    networks:
      pes_network:
    volumes:
      - horizen-cce-subgraph-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph-node"]
      interval: 5s
      timeout: 5s
      retries: 10
  subgraph-ipfs:
    image: ipfs/kubo:v0.17.0
    container_name: horizen-cce-subgraph-ipfs
    restart: always
    networks:
      pes_network:
    volumes:
      - horizen-cce-subgraph-ipfs:/data/ipfs
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        ipfs init --profile=server 2>/dev/null || true
        ipfs bootstrap rm --all
        ipfs config Addresses.API /ip4/0.0.0.0/tcp/5001
        exec ipfs daemon --migrate=true
    healthcheck:
      test: ["CMD-SHELL", "ipfs id"]
      interval: 5s
      timeout: 5s
      retries: 10
  subgraph-node:
    image: graphprotocol/graph-node
    container_name: horizen-cce-subgraph-node
    restart: always
    ports:
      - "8000:8000"
    environment:
      postgres_host: subgraph-postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: "subgraph-ipfs:5001"
      ethereum: "local:http://${CHAIN_RPC_ADDRESS}:${CHAIN_RPC_PORT}"
      GRAPH_LOG: info
    networks:
      pes_network:
      inet:
    depends_on:
      subgraph-postgres:
        condition: service_healthy
      subgraph-ipfs:
        condition: service_healthy
      chain:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8030"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
  subgraph-deployer:
    image: horizen/cce-subgraph-deployer
    container_name: horizen-cce-subgraph-deployer
    restart: "no"
    environment:
      - GRAPH_NODE_URL=http://subgraph-node:8020
      - IPFS_URL=http://subgraph-ipfs:5001
    networks:
      pes_network:
    volumes:
      - horizen-cce-deploy-data:/deploy-data:ro
    depends_on:
      subgraph-node:
        condition: service_healthy
      deployer:
        condition: service_completed_successfully
