name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  quick-test:
    name: Quick Test Suite
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Setup Go
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'

    # Setup Node.js for contracts
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: contracts/package-lock.json

    # Install Go dependencies
    - name: Download Go dependencies
      run: go mod download

    # Build a Go project
    - name: Build Go project
      run: |
        go build ./...
        go build ./cmd/executor
        go build ./cmd/manager

    # Run Go tests
    - name: Run Go tests quick
      run: CI_FLAG=true go test -v ./...

    # Install Node.js dependencies for contracts
    - name: Install contract dependencies
      working-directory: contracts
      run: npm ci

    # Build contracts
    - name: Build contracts
      working-directory: contracts
      run: npm run build

    # Test contracts
    - name: Test contracts
      working-directory: contracts
      run: npm run test
  full-test:
    name: Full Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Setup Go
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      # Setup Node.js for contracts
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      # Install Go dependencies
      - name: Download Go dependencies
        run: go mod download

      # Build a Go project
      - name: Build Go project
        run: |
          go build ./...

      # Run ALL Go tests (including long-running ones)
      - name: Run Go tests (full suite)
        run: CI_FLAG= go test -v ./...
        timeout-minutes: 10

      # Run ALL Go tests and generate report
      - name: Run Go tests (full suite)
        run: |
          CI_FLAG= go test ./... -json > full-test-results.json
          CI_FLAG= go test -v ./... > full-test-output.txt
        timeout-minutes: 10
        continue-on-error: true

      # Generate full test report
      - name: Full Test Report
        uses: dorny/test-reporter@v2
        if: success() || failure()
        with:
          name: Go Tests (Full Suite)
          path: full-test-results.json
          reporter: 'golang-json'
          fail-on-error: true

      # Install Node.js dependencies for contracts
      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci

      # Build contracts
      - name: Build contracts
        working-directory: contracts
        run: npm run build

      # Test contracts
      - name: Test contracts
        working-directory: contracts
        run: npm run test