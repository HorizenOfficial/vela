name: CI with Duplicated Jobs

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  quick-test:
    name: Quick Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Setup Go
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      # Setup Node.js for contracts
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      # Install Node.js dependencies for contracts
      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci

      # Install Go dependencies
      - name: Download Go dependencies
        run: go mod download

      # Install dependencies for abigen
      - name: Install abigen and solc
        run: |
          sudo add-apt-repository -y ppa:ethereum/ethereum
          sudo apt-get update
          sudo apt-get install -y solc
          go install github.com/ethereum/go-ethereum/cmd/abigen@v1.16.2

      # Generate contracts bindings
      - name: Generate contracts bindings
        run: go generate ./...

      # Build a Go project
      - name: Build Go project
        run: |
          go build ./...
          go build ./cmd/executor
          go build ./cmd/manager

      # Run Go tests
      - name: Run Go tests quick
        run: CI_FLAG=true go test -v ./...
      
      # Build contracts
      - name: Build contracts
        working-directory: contracts
        run: npm run build

      # Test contracts
      - name: Test contracts
        working-directory: contracts
        run: npm run test

  full-test:
    name: Full Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Setup Go
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      # Setup Node.js for contracts
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      # Install Node.js dependencies for contracts
      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci

      # Install Go dependencies
      - name: Download Go dependencies
        run: go mod download

      # Install dependencies for abigen
      - name: Install abigen and solc
        run: |
          sudo add-apt-repository -y ppa:ethereum/ethereum
          sudo apt-get update
          sudo apt-get install -y solc
          go install github.com/ethereum/go-ethereum/cmd/abigen@v1.16.2

      # Generate contracts bindings
      - name: Generate contracts bindings
        run: go generate ./...

      # Build a Go project
      - name: Build Go project
        run: |
          go build ./...
          go build ./cmd/executor
          go build ./cmd/manager

      # Run ALL Go tests (including long-running ones)
      - name: Run Go tests (full suite)
        run: CI_FLAG= go test -v ./...
        timeout-minutes: 10
      
      # Build contracts
      - name: Build contracts
        working-directory: contracts
        run: npm run build

      # Test contracts
      - name: Test contracts
        working-directory: contracts
        run: npm run test
