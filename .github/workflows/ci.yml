name: CI with Duplicated Jobs

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  quick-test:
    name: Quick Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Setup Go
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      # Setup Node.js for contracts
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      # Install Node.js dependencies for contracts
      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci

      # Install Go dependencies
      - name: Download Go dependencies
        run: go mod download

      # Install solc
      - name: Install solc
        run: |
          sudo add-apt-repository -y ppa:ethereum/ethereum
          sudo apt-get update
          sudo apt-get install -y solc

      # Install abigen (from go-ethereum)
      - name: Install abigen
        run: go install github.com/ethereum/go-ethereum/cmd/abigen@1.16.2-stable

      # Install TinyGo for WASM module
      - name: Install TinyGo
        run: |
          wget https://github.com/tinygo-org/tinygo/releases/download/v0.39.0/tinygo_0.39.0_amd64.deb
          sudo dpkg -i tinygo_0.39.0_amd64.deb

      # ✅ Verify generated files consistency
      - name: Verify generated files are up-to-date
        timeout-minutes: 5
        run: |
          echo "Running go generate and checking for changes..."
          set -x
          go generate -v ./... || { echo "go generate failed"; exit 1; }
          echo "Files after generation:"
          git status
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "❌ Generated files are out of date. Please run 'go generate ./...' and commit the results."
            git diff
            exit 1
          else
            echo "✅ Generated files are up-to-date."
          fi

      # Build a Go project
      - name: Build Go project
        run: |
          go build ./...
          go build ./cmd/executor
          go build ./cmd/manager

      # Run Go tests
      - name: Run Go tests quick
        run: CI_FLAG=true go test -v ./...
      
      # Build contracts
      - name: Build contracts
        working-directory: contracts
        run: npm run build

      # Test contracts
      - name: Test contracts
        working-directory: contracts
        run: npm run test

  full-test:
    name: Full Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Setup Go
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      # Setup Node.js for contracts
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      # Install Node.js dependencies for contracts
      - name: Install contract dependencies
        working-directory: contracts
        run: npm ci

      # Install Go dependencies
      - name: Download Go dependencies
        run: go mod download

      # Install dependencies for solc
      - name: Install solc
        run: |
          sudo add-apt-repository -y ppa:ethereum/ethereum
          sudo apt-get update
          sudo apt-get install -y solc

      # Install abigen (from go-ethereum)
      - name: Install abigen
        run: go install github.com/ethereum/go-ethereum/cmd/abigen@1.16.2-stable

      # Install TinyGo for WASM module
      - name: Install TinyGo
        run: |
          wget https://github.com/tinygo-org/tinygo/releases/download/v0.39.0/tinygo_0.39.0_amd64.deb
          sudo dpkg -i tinygo_0.39.0_amd64.deb

      # ✅ Verify generated files consistency
      - name: Verify generated files are up-to-date
        timeout-minutes: 5
        run: |
          echo "Running go generate and checking for changes..."
          set -x
          go generate -v ./... || { echo "go generate failed"; exit 1; }
          echo "Files after generation:"
          git status
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "❌ Generated files are out of date. Please run 'go generate ./...' and commit the results."
            git diff
            exit 1
          else
            echo "✅ Generated files are up-to-date."
          fi

      # Build a Go project
      - name: Build Go project
        run: |
          go build ./...
          go build ./cmd/executor
          go build ./cmd/manager

      # Run ALL Go tests (including long-running ones)
      - name: Run Go tests (full suite)
        run: CI_FLAG= go test -v ./...
        timeout-minutes: 10
      
      # Build contracts
      - name: Build contracts
        working-directory: contracts
        run: npm run build

      # Test contracts
      - name: Test contracts
        working-directory: contracts
        run: npm run test
