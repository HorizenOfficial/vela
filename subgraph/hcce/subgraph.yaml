specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ProcessorEndpoint
    network: mainnet
    source:
      address: "0xa2dD817c2fDc3a2996f1A5174CF8f1AaED466E82"
      abi: ProcessorEndpoint
      startBlock: 12498890
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - OwnershipTransferred
      abis:
        - name: ProcessorEndpoint
          file: ./abis/ProcessorEndpoint.json
      eventHandlers:
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
      file: ./src/processor-endpoint.ts
